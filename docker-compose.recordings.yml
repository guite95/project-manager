# Vault production only: append after identity-boundary and vault overrides.
# Activation is controlled by the root-owned recordings marker.
services:
  app:
    environment:
      GOOGLE_SPEECH_LOCATION: ${GOOGLE_SPEECH_LOCATION:-us}
      GOOGLE_SPEECH_BUCKET: ${GOOGLE_SPEECH_BUCKET:?GOOGLE_SPEECH_BUCKET is required}
  recordings:
    image: ${APP_IMAGE:-project-management:local}
    container_name: project-management-recordings
    restart: "no"
    init: true
    # Host migration completes before systemd starts this worker.
    command: [node, --experimental-strip-types, scripts/recordings-worker.mjs]
    ulimits:
      core: 0
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      PM_SECRET_DIRECTORY: /run/oci-service-secrets/project-management
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT is required}
      GOOGLE_SPEECH_LOCATION: ${GOOGLE_SPEECH_LOCATION:-us}
      GOOGLE_SPEECH_BUCKET: ${GOOGLE_SPEECH_BUCKET:?GOOGLE_SPEECH_BUCKET is required}
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_ACCESS_TOKEN_FILE: /run/project-management-google/access-token.json
      OCI_STORAGE_REGION: ${OCI_STORAGE_REGION:-}
      OCI_STORAGE_NAMESPACE: ${OCI_STORAGE_NAMESPACE:-}
      OCI_STORAGE_BUCKET: ${OCI_STORAGE_BUCKET:-}
      OCI_STORAGE_AUTH: broker
      OCI_STORAGE_BROKER_SOCKET: /run/project-management-broker/storage.sock
    group_add:
      - ${PM_RUNTIME_GID:?PM_RUNTIME_GID is required}
    volumes:
      - type: bind
        source: /run/project-management-broker
        target: /run/project-management-broker
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/project-management-google
        target: /run/project-management-google
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/oci-service-secrets/project-management
        target: /run/oci-service-secrets/project-management
        read_only: true
        bind:
          create_host_path: false
    networks: [db]
    cpus: 1
    mem_limit: 768m
    stop_grace_period: 90s
