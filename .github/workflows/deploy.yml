name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-management-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      APP_IMAGE: project-management:${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test scoped image cleanup
        run: bash scripts/prune-deployment-images.test.sh

      - name: Test identity deployment guards
        run: |
          node --test scripts/deploy-identity-boundary.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 ops/oci-runtime/imds-guard.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 ops/oci-runtime/prepare-cutover.test.py

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY; do
            test -n "${!name}" || { echo "$name secret is required." >&2; exit 1; }
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 ))
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 .github/deploy_known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            HostKeyAlias deploy-target
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 3
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Check server prerequisites
        run: |
          ssh deploy-target 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd ~/project-management
          test -r .env || { echo 'Deployment .env is required.' >&2; exit 1; }
          test -w .
          install -d -m 0755 scripts
          docker info > /dev/null
          docker compose version
          command -v curl > /dev/null
          runtime_gid=$(getent group pm-runtime | cut -d: -f3)
          [[ "$runtime_gid" =~ ^[0-9]+$ ]]
          sudo -n /opt/node24/bin/node /opt/project-management-runtime/current/ops/oci-runtime/identity-readiness.mjs "$runtime_gid"
          test -r /opt/project-management-runtime/current/ops/oci-runtime/project-management-runtime.service
          test -r /opt/project-management-runtime/current/ops/oci-runtime/imds-guard.py
          REMOTE

      - name: Build ARM64 image and verify Prisma CLI
        run: |
          set -euo pipefail
          docker build --pull --platform linux/arm64 --tag "$APP_IMAGE" .
          docker run --rm --entrypoint node_modules/.bin/prisma \
            -e DATABASE_URL=postgresql://build:build@127.0.0.1:5432/build \
            "$APP_IMAGE" validate
          docker save "$APP_IMAGE" | gzip > "$RUNNER_TEMP/project-management.tar.gz"

      - name: Upload image and Compose file
        run: |
          scp "$RUNNER_TEMP/project-management.tar.gz" docker-compose.yml docker-compose.identity-boundary.yml \
            deploy-target:project-management/
          scp scripts/prune-deployment-images.sh scripts/deploy-identity-boundary.sh deploy-target:project-management/scripts/
          scp ops/oci-runtime/prepare-cutover.py deploy-target:project-management/scripts/prepare-identity-cutover.py

      - name: Start app and verify response
        run: |
          ssh deploy-target bash -se -- "$APP_IMAGE" <<'REMOTE'
          set -euo pipefail
          cd ~/project-management
          export APP_IMAGE="$1"
          export PM_RUNTIME_GID
          PM_RUNTIME_GID=$(getent group pm-runtime | cut -d: -f3)
          export COMPOSE_FILE=docker-compose.yml:docker-compose.identity-boundary.yml
          docker compose config --quiet
          if docker inspect project-management > /dev/null 2>&1; then
            bash scripts/prune-deployment-images.sh snapshot \
              .deploy-image-state.tsv \
              project-management=project-management
          else
            rm -f .deploy-image-state.tsv
            echo 'No previous app container; image cleanup state was not created.'
          fi
          docker load --input project-management.tar.gz
          rm project-management.tar.gz
          bash scripts/deploy-identity-boundary.sh "$APP_IMAGE"

          # migrate deploy 가 끝나고 로그인 화면이 응답할 때까지 최대 30회 확인한다.
          for attempt in $(seq 1 30); do
            response=$(curl --silent --output /dev/null --max-time 5 \
              --write-out '%{http_code} %{redirect_url}' http://127.0.0.1:30001/today) || response=''
            login_status=$(curl --silent --output /dev/null --max-time 5 \
              --write-out '%{http_code}' http://127.0.0.1:30001/login) || login_status=''
            if [[ "$response" =~ ^307\ https?://[^/]+/login$ && "$login_status" == '200' ]]; then
              printf 'Deployment healthy: %s\n' "$APP_IMAGE"
              # 이후 수동 compose 명령도 배포된 이미지 태그를 사용한다.
              docker tag "$APP_IMAGE" project-management:local
              exit 0
            fi
            sleep 5
          done
          echo 'App did not return the expected login redirect.' >&2
          docker compose ps app
          exit 1
          REMOTE

      - name: Verify public HTTPS route
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --output /dev/null --max-time 20 \
            --write-out '%{http_code} %{redirect_url}' https://project.dev-uk.shop/today)
          login_status=$(curl --silent --show-error --output /dev/null --max-time 20 \
            --write-out '%{http_code}' https://project.dev-uk.shop/login)
          # 실패해도 실제 응답을 남겨 원인(차단/오류)을 바로 알 수 있게 한다.
          printf 'today=[%s] login=[%s]\n' "$response" "$login_status"
          [[ "$response" == '307 https://project.dev-uk.shop/login' ]]
          [[ "$login_status" == '200' ]]

      - name: Retain rollback images and clean old app images
        run: |
          ssh deploy-target 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd ~/project-management
          if [[ -f .deploy-image-state.tsv ]]; then
            bash scripts/prune-deployment-images.sh cleanup \
              .deploy-image-state.tsv \
              project-management=project-management
          else
            echo 'Image cleanup skipped: no previous deployment state.'
          fi
          REMOTE

      - name: Clean up runner credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config "$RUNNER_TEMP/project-management.tar.gz"
