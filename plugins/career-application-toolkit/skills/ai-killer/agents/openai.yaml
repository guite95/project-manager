interface:
  display_name: ai killer
  short_description: 글의 AI 작성 여부를 검토하되 작성 출처에 대한 판단과 문체상 인상을 구분한다. 원문에서 상투적 표현, 반복되는
    문장 구조, 추상적인 주장, 번역투, 과장, 불필요한 요약 등 AI처럼 느껴질 수 있는 구간을 찾아 근거와 수정안을 제안한다. 실제 사실·의미·개인
    기여·작성자의 목소리를 보존하며, 자기소개서·보고서·이메일·블로그 등 글의 목적에 맞게 검토한다. 사용자가 “AI가 쓴 것 같아?”, “AI티
    나는 부분을 찾아줘”, “챗GPT 말투를 줄여줘”, “자연스럽게 다듬어줘” 등을 요청하면 사용한다.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  allow_implicit_invocation: true
