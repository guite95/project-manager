# Cloudflare terminates HTTPS; preserve its protocol for the app.
map $http_x_forwarded_proto $project_management_forwarded_proto {
    default $scheme;
    https https;
}

upstream project_management_app {
    server 127.0.0.1:30001;
    keepalive 16;
}

server {
    listen 80;
    server_name project.dev-uk.shop;
    client_max_body_size 101m;

    # Checks the proxy route only; app readiness is checked by the workflow.
    location = /.well-known/project-management-health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location / {
        proxy_pass http://project_management_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $project_management_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        error_page 502 504 =503 @deployment_pending;
    }

    location @deployment_pending {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 503 "Application deployment is pending.\n";
    }
}
