# PostgreSQL 은 이 인스턴스에 이미 떠 있는 컨테이너를 쓴다. 여기서 새로 띄우지 않는다.
services:
  app:
    build: .
    image: ${APP_IMAGE:-project-management:local}
    container_name: project-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:30001:30001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?APP_PASSWORD_HASH is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    networks:
      - db

networks:
  db:
    # 이미 돌고 있는 PostgreSQL 컨테이너가 붙어 있는 네트워크 이름으로 바꾼다.
    # `docker network ls` 로 확인한다.
    external: true
    name: ${DB_NETWORK_NAME:?DB_NETWORK_NAME is required}
