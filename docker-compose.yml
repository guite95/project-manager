# PostgreSQL 은 이 인스턴스에 이미 떠 있는 컨테이너를 쓴다. 여기서 새로 띄우지 않는다.
services:
  app:
    build: .
    image: ${APP_IMAGE:-project-management:local}
    container_name: project-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:30001:30001"
    environment:
      # 오늘 목록 롤오버가 사용자 기준 날짜로 판정되어야 한다. 컨테이너 기본값은 UTC 라
      # 한국 시간 자정부터 오전 9시까지 하루가 밀린다. alpine 에 zoneinfo 는 없지만
      # Node 가 번들 ICU 로 해석하므로 TZ 만으로 충분하다.
      TZ: Asia/Seoul
      # Vault override removes these entries; legacy mode validates them before deploy.
      DATABASE_URL: ${DATABASE_URL:-}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      OCI_STORAGE_REGION: ${OCI_STORAGE_REGION:-}
      OCI_STORAGE_NAMESPACE: ${OCI_STORAGE_NAMESPACE:-}
      OCI_STORAGE_BUCKET: ${OCI_STORAGE_BUCKET:-}
      OCI_STORAGE_AUTH: instance_principal
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-google}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-1}
      AI_SEARCH_MIN_COSINE: ${AI_SEARCH_MIN_COSINE:-0.68}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us}
      # Optional mounted ADC/WIF configuration path; no credential values in compose.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    networks:
      - db

networks:
  db:
    # 이미 돌고 있는 PostgreSQL 컨테이너가 붙어 있는 네트워크 이름으로 바꾼다.
    # `docker network ls` 로 확인한다.
    external: true
    name: ${DB_NETWORK_NAME:?DB_NETWORK_NAME is required}
